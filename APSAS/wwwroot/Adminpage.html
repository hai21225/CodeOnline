<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm User</title>
    <link rel="stylesheet" href="Css/Admin.css">
</head>
<body>

    <!-- NAV TOP RIGHT -->
    <div class="top-nav">
        <button onclick="window.location.href='StudentDashboard.html'">Sinh Viên</button>
        <button onclick="window.location.href='DashboardLecturer.html'">Giảng Viên</button>
        <button onclick="logout()">Đăng xuất</button>
    </div>

    <div class="container">
        <h1>Admin</h1>

        <div class="card">
            <h2>Thêm Người Dùng</h2>

            <label for="username">Username</label>
            <input id="username" type="text" />

            <label for="email">Email</label>
            <input id="email" type="email" />

            <label for="fullname">Full Name</label>
            <input id="fullname" type="text" />

            <label for="password">Password</label>
            <input id="password" type="password" />

            <label for="roleid">Role</label>
            <select id="roleid">
                <option value="1">Admin</option>
                <option value="2">Giảng viên</option>
                <option value="3">Sinh viên</option>
            </select>

            <button id="submitUserBtn">Thêm User</button>

            <p id="userMessage" class="message"></p>
        </div>
    </div>

    <!-- ⚠️ Giữ lại để JS không lỗi -->
    <div id="userTableContainer" style="display:none;"></div>
    <div id="editOverlay" style="display:none;"></div>
    <div id="studentMessages" style="display:none;"></div>

    <script src="Js/Admin.js"></script>
</body>
</html>
